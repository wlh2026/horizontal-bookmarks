name: Build & Release

# 触发条件：
#   - push 到 main        → 自动打包，上传构建产物（dist/*.zip）
#   - 推送 v* 标签         → 自动构建并创建 GitHub Release，把两个 zip 作为附件发布
#   - 手动触发（workflow_dispatch）
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release / 上传附件需要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 打包 Edge / Chrome 发行包
        run: python build.py

      - name: 上传构建产物（每次 push，含 zip + crx）
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.{zip,crx}
          if-no-files-found: error

      - name: 打标签时创建 Release 并上传附件（zip + crx）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" dist/*.{zip,crx} \
            --title "$VERSION" \
            --notes "horizontal-bookmarks v$VERSION：Edge / Chrome 发行包（zip 可解压加载，crx 可直接拖入安装）。"
